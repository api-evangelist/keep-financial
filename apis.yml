name: Keep Financial
description: Keep Financial Technologies, Inc. is a compensation technology company
  that provides a vesting cash bonus platform. Employers deliver upfront cash to employees
  that is earned (vests) over a customizable time period with a legally enforceable
  right to repayment, automating signing bonuses, retention bonuses, annual and performance
  bonuses, spot bonuses, tuition reimbursement, M&A retention packages, and severance.
  The platform serves compensation, HR, finance, legal, and executive leaders across
  healthcare, construction, logistics, technology, retail, hospitality, manufacturing,
  and other industries. Keep Financial was added to the API Evangelist network as an
  a16z portfolio company; it operates a SaaS web application and does not currently
  publish a public developer API.
